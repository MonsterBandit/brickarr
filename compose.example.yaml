# Brickarr — the simple install: one container, SQLite, nothing else to run.
#
#   cp .env.example .env      # optional: PUID/PGID/TZ/UMASK
#   docker compose -f compose.example.yaml up -d
#
# Brickarr is then at http://localhost:5858. Point the /library mount at the
# folder for your LEGO files, owned by the PUID/PGID user. Brickarr never
# changes the ownership of files already there.
#
# Data-source keys (Brickset, and Rebrickable once it arrives) are entered in
# the app at Settings -> Data Sources, never here. For MariaDB instead of
# SQLite, see compose.mariadb.example.yaml.

name: brickarr

services:
  brickarr:
    image: ghcr.io/monsterbandit/brickarr:latest
    container_name: brickarr
    restart: unless-stopped
    ports:
      - "5858:5858"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-Etc/UTC}"
      UMASK: "${UMASK:-022}"
      # To keep re-downloadable files apart from your own, mount /cache below
      # and uncomment this line:
      # BRICKARR_CACHE_DIR: /cache
    volumes:
      - ./config:/config     # settings, the SQLite database, logs
      - ./library:/library   # your LEGO files
      # - ./cache:/cache     # optional: re-downloadable booklets
